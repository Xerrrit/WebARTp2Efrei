<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP Web3D - Exo 5</title>

  <!-- A-Frame 1.4.2 + Système de physique -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    AFRAME.registerComponent('mouvement-physique', {
      init: function () {
        this.keys = {};
        this.auSol = false;

        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

        // Détection si le cube touche le sol/un objet
        this.el.addEventListener('collide', () => {
          this.auSol = true;
        });
      },

      tick: function () {
        if (!this.el.body) return; // Attend que le corps physique soit chargé

        let vitesse = 5;
        let vx = 0;
        let vz = 0;

        // Déplacements
        if (this.keys['KeyW'] || this.keys['KeyZ']) vz -= vitesse;
        if (this.keys['KeyS']) vz += vitesse;
        if (this.keys['KeyA'] || this.keys['KeyQ']) vx -= vitesse;
        if (this.keys['KeyD']) vx += vitesse;

        // Application des vitesses sur le corps physique
        this.el.body.velocity.x = vx;
        this.el.body.velocity.z = vz;

        // Empêche le cube de basculer/tourner sur lui-même lors des mouvements
        this.el.body.angularVelocity.set(0, 0, 0);

        // Saut physique
        if (this.keys['Space'] && this.auSol) {
          this.el.body.velocity.y = 5;
          this.auSol = false;
        }
      }
    });
  </script>
</head>

<body>

<!-- Déclaration de la scène physique (gravité de la Terre -9.8 m/s²) -->
<a-scene physics="gravity: -9.8">

  <a-assets>
    <img id="skyTexture" src="Skybox.png">
    <img id="grassTexture" src="Grass.png">
  </a-assets>

  <a-sky src="#skyTexture"></a-sky>

  <!-- Sol physique fixe (static-body) -->
  <a-box
    position="0 -0.05 0"
    width="20"
    height="0.1"
    depth="20"
    src="#grassTexture"
    repeat="10 10"
    static-body
  ></a-box>

  <!-- Joueur physique dynamique (dynamic-body) -->
  <a-box
    id="joueur"
    position="0 0.5 0"
    width="1"
    height="1"
    depth="1"
    color="#4CC3D9"
    dynamic-body="mass: 2"
    mouvement-physique
  ></a-box>

  <a-entity camera look-controls position="0 2.5 5"></a-entity>

    <!-- Cube obstacle solide (immobile) -->
  <a-box position="-2 0.5 -3" color="#FFC65D" static-body></a-box>

  <!-- Cube obstacle poussable (soumis à la physique) -->
  <a-box position="2 0.5 -2" color="#F15355" dynamic-body="mass: 1"></a-box>
</a-scene>

</body>
</html>
