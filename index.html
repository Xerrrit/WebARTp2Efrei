<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP2 Web AR mais il manque la camera</title>

  <!-- A-Frame 1.4.2 + Système de physique -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    AFRAME.registerComponent('controle-joueur', {
      init: function () {
        this.keys = {};
        this.auSol = false;

        // Gestion du clavier
        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

        // Détection du contact avec le sol pour le saut
        this.el.addEventListener('collide', () => {
          this.auSol = true;
        });
      },

      tick: function () {
        if (!this.el.body) return;

        let camera = document.getElementById('camera');
        let playerPos = this.el.object3D.position;

        // 1. SUIVI DE LA CAMÉRA : La caméra suit les coordonnées du joueur avec un décalage
        camera.setAttribute('position', {
          x: playerPos.x,
          y: playerPos.y + 2.5,
          z: playerPos.z + 5
        });

        // 2. ORIENTATION DES DÉPLACEMENTS SELON LA CAMÉRA
        let cameraRotation = camera.getAttribute('rotation');
        let angleRad = cameraRotation.y * (Math.PI / 180);

        let inputX = 0;
        let inputZ = 0;

        if (this.keys['KeyW'] || this.keys['KeyZ']) inputZ -= 1; // Avancer vers la caméra
        if (this.keys['KeyS']) inputZ += 1;                       // Reculer
        if (this.keys['KeyA'] || this.keys['KeyQ']) inputX -= 1; // Gauche
        if (this.keys['KeyD']) inputX += 1;                       // Droite

        let vitesse = 6;
        let vx = 0;
        let vz = 0;

        if (inputX !== 0 || inputZ !== 0) {
          // Calcul de la direction selon l'orientation Y de la caméra
          vx = (inputX * Math.cos(angleRad) + inputZ * Math.sin(angleRad)) * vitesse;
          vz = (-inputX * Math.sin(angleRad) + inputZ * Math.cos(angleRad)) * vitesse;
        }

        // Application des vitesses physiques
        this.el.body.velocity.x = vx;
        this.el.body.velocity.z = vz;

        // Bloque le cube pour éviter qu'il ne se renverse sur le côté
        this.el.body.angularVelocity.set(0, 0, 0);

        // 3. SAUT PHYSIQUE
        if (this.keys['Space'] && this.auSol) {
          this.el.body.velocity.y = 5;
          this.auSol = false;
        }
      }
    });
  </script>
</head>

<body>

<!-- Scène avec Physique -->
<a-scene physics="gravity: -9.8">

  <a-assets>
    <img id="skyTexture" src="Skybox.png">
    <img id="grassTexture" src="Grass.png">
  </a-assets>

  <!-- Exo 1: Ciel -->
  <a-sky src="#skyTexture"></a-sky>

  <!-- Exo 1: Sol Solide -->
  <a-box
    position="0 -0.05 0"
    width="20"
    height="0.1"
    depth="20"
    src="#grassTexture"
    repeat="10 10"
    static-body
  ></a-box>

  <!-- Exo 2/4/5: Joueur Physiqué -->
  <a-box
    id="joueur"
    position="0 0.5 0"
    width="1"
    height="1"
    depth="1"
    color="#4CC3D9"
    dynamic-body="mass: 2"
    controle-joueur
  ></a-box>

  <!-- Exo 6: Obstacles pour tester les collisions -->
  <a-box position="-2 0.5 -3" color="#FFC65D" static-body></a-box>
  <a-box position="2 0.5 -2" color="#F15355" dynamic-body="mass: 1"></a-box>

  <!-- Exo 3: Caméra qui suit le cube -->
  <a-entity id="camera" camera look-controls position="0 2.5 5"></a-entity>

</a-scene>

</body>
</html>
