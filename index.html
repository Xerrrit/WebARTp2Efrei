<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Frame Scene</title>
  
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

  <!-- Gestion des ressources (Textures) -->
  <a-assets>
    <img id="skyTexture" src="Skybox.png">
    <img id="grassTexture" src="Grass.png">
  </a-assets>

  <!-- Skybox -->
  <a-sky src="#skyTexture"></a-sky>

  <!-- Sol -->
  <a-box
    position="0 -0.05 0"
    width="15"
    height="0.1"
    depth="15"
    src="#grassTexture"
    repeat="10 10"
  ></a-box>

  <!-- Caméra pour bien visualiser la scène -->
  <a-entity camera look-controls position="0 1.6 3"></a-entity>

</a-scene>

</body>
</html>
